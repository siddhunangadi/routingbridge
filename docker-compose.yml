services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      # DATABASE_URL comes from here — point it at Supabase/Postgres (see
      # README) or, for local-file SQLite instead, set it to
      # sqlite:////app/data/modelpilot.db and keep the ./data volume below.
      - .env
    environment:
      - PORT=8080
    volumes:
      - ./data:/app/data
