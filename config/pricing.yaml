# Illustrative per-1M-token pricing (USD), approximate as of provider
# pricing pages. Not hardcoded in Python so a price change is a config
# edit, not a redeploy. Each entry also carries `provider` so the cost
# estimator and dashboard can group spend by provider, not just model.

models:
  gemini-2.5-flash:
    provider: google
    input_per_million: 0.30
    output_per_million: 2.50
  mistralai/mistral-small-3.2-24b-instruct:
    provider: openrouter
    input_per_million: 0.10
    output_per_million: 0.30
  deepseek/deepseek-r1:
    provider: openrouter
    input_per_million: 0.55
    output_per_million: 2.19
