# Routing configuration: which provider/model handles each routing tier,
# and why. Kept out of Python so routing policy can change without a code
# deploy. Only two providers exist: "google" (native Gemini SDK) and
# "openrouter" (single gateway to Mistral/DeepSeek/Qwen/Llama/etc).
#
# The routing engine only ever reasons about tiers (BASIC/STANDARD/ADVANCED)
# — it never hardcodes a provider or model name. This file is the only
# place that decision lives.

classifier:
  provider: google
  model: gemini-2.5-flash
  # Gemini 2.5 Flash spends part of this budget on internal "thinking"
  # tokens before producing visible output, even for a tiny JSON reply —
  # too small a budget truncates the JSON mid-string. Thinking token spend
  # scales with prompt complexity, so this needs real headroom, not just
  # enough for the classifier's own short response.
  max_output_tokens: 1024

confidence_thresholds:
  high: 0.9
  low: 0.6
  # low-confidence routing decisions get escalated to the next tier up
  # (basic -> standard -> advanced) by the routing engine, not the classifier.
  escalate_on_low_confidence: true

tiers:
  basic:
    provider: google
    model: gemini-2.5-flash
    max_output_tokens: 1024
    reasons:
      - "Simple, short prompt"
      - "Low reasoning complexity"
      - "Fast, cheap model is sufficient"
  standard:
    provider: openrouter
    model: mistralai/mistral-small-3.2-24b-instruct
    max_output_tokens: 1536
    reasons:
      - "Requires moderate multi-step reasoning"
      - "Structured but not deeply technical"
  advanced:
    provider: openrouter
    model: deepseek/deepseek-r1
    # DeepSeek R1 is a reasoning model: it spends part of this budget on
    # hidden reasoning tokens before writing the visible answer. A budget
    # sized only for the answer truncates to an empty response on anything
    # but the simplest prompts (observed: null content at max_tokens=1024
    # on a 4-part "explain in depth" prompt).
    max_output_tokens: 4096
    reasons:
      - "Complex, multi-step reasoning required"
      - "Long or nuanced prompt"
      - "Higher-capability model justified despite cost"
