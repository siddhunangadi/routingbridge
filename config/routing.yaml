# Routing configuration: which provider/model handles each routing tier,
# and why. Kept out of Python so routing policy can change without a code
# deploy. Only two providers exist: "google" (native Gemini SDK) and
# "openrouter" (single gateway to Mistral/DeepSeek/Qwen/Llama/etc).
#
# The routing engine only ever reasons about tiers (BASIC/STANDARD/ADVANCED)
# — it never hardcodes a provider or model name. This file is the only
# place that decision lives.

# Snapshotted into the routing_policies table at startup so every routing
# decision can point at exactly the policy version that produced it. Bump
# this manually when tiers/thresholds below change meaningfully.
policy_version: "v1.0"

classifier:
  # Runs on every request (classify + quality-verify), so it competed with
  # the BASIC tier's own Gemini calls for the same 20-request/day free-tier
  # quota and exhausted it within minutes of real traffic. Moved to
  # OpenRouter, which the STANDARD tier already uses without quota issues.
  provider: openrouter
  model: mistralai/mistral-small-3.2-24b-instruct
  max_output_tokens: 512

confidence_thresholds:
  high: 0.9
  low: 0.6
  # low-confidence routing decisions get escalated to the next tier up
  # (basic -> standard -> advanced) by the routing engine, not the classifier.
  escalate_on_low_confidence: true

tiers:
  basic:
    provider: google
    model: gemini-2.5-flash
    max_output_tokens: 1024
    reasons:
      - "Simple, short prompt"
      - "Low reasoning complexity"
      - "Fast, cheap model is sufficient"
  standard:
    provider: openrouter
    model: mistralai/mistral-small-3.2-24b-instruct
    max_output_tokens: 1536
    reasons:
      - "Requires moderate multi-step reasoning"
      - "Structured but not deeply technical"
  advanced:
    provider: openrouter
    model: deepseek/deepseek-r1
    # DeepSeek R1 is a reasoning model: it spends part of this budget on
    # hidden reasoning tokens before writing the visible answer. A budget
    # sized only for the answer truncates to an empty response on anything
    # but the simplest prompts (observed: null content at max_tokens=1024
    # on a 4-part "explain in depth" prompt).
    max_output_tokens: 4096
    reasons:
      - "Complex, multi-step reasoning required"
      - "Long or nuanced prompt"
      - "Higher-capability model justified despite cost"

# Governs routing_learning.py (PR2) and, from PR3 on, the DecisionCard.
# min_sample_size/min_confidence gate whether a routing_pattern is
# trustworthy enough to become an optimization_recommendation —
# refresh() always computes patterns and recommendations regardless.
# `apply_recommendations` is a SEPARATE, later gate: whether PR3 surfaces
# an existing recommendation as "Recommendation Available" on a live
# request's DecisionCard. `false` by default. Neither flag ever lets a
# recommendation change what routing.yaml's tiers actually route to —
# that still requires a human to bump policy_version. (Renamed from
# `enabled`, which conflated "generate" with "surface" — see PR2 review.)
learning:
  apply_recommendations: false
  min_sample_size: 20
  min_confidence: 0.80
